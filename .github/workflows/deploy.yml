name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./berutek.ui
          file: ./berutek.ui/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_RECAPTCHA_SECRET_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SECRET_KEY }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  build-serv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./berutek.serv
          file: ./berutek.serv/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}-serv:latest
            ghcr.io/${{ github.repository }}-serv:${{ github.sha }}

  deploy:
    needs: [build, build-serv]
    runs-on: self-hosted
    steps:
      - name: Login to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write server environment
        env:
          # Database
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # Auth secrets
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # OIDC
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
          OIDC_DISCOVERY_URL: ${{ secrets.OIDC_DISCOVERY_URL }}
          OIDC_CALLBACK_URL: ${{ secrets.OIDC_CALLBACK_URL }}
          #Frontend
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          # Application
          APP_CORS_ORIGIN: ${{ secrets.APP_CORS_ORIGIN }}
          # Mail
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          {
            echo "NODE_ENV=production"
            echo "PORT=3030"
            echo "API_PREFIX=/api/v1"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_SYNCHRONIZE=false"
            echo "DB_LOGGING=false"
            echo "SESSION_SECRET=${SESSION_SECRET}"
            echo "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}"
            echo "JWT_ACCESS_EXPIRATION=15m"
            echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
            echo "JWT_REFRESH_EXPIRATION=7d"
            echo "JWT_ISSUER=berutek"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "ENCRYPTION_KEY=${ENCRYPTION_KEY}"
            echo "APP_CORS_ORIGIN=${APP_CORS_ORIGIN}"
            echo "OIDC_CLIENT_ID=${OIDC_CLIENT_ID}"
            echo "OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}"
            echo "OIDC_ISSUER_URL=${OIDC_ISSUER_URL}"
            echo "OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL}"
            echo "OIDC_CALLBACK_URL=${OIDC_CALLBACK_URL}"
            echo "SMTP_HOST=${SMTP_HOST}"
            echo "SMTP_PORT=${SMTP_PORT}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
            echo "SMTP_FROM=${SMTP_FROM}"
          } > /opt/berutek/.env.serv

      - name: Pull and restart UI
        run: |
          cd /opt/berutek
          docker compose pull app
          docker compose up -d --no-deps app

      - name: Pull and restart server
        run: |
          cd /opt/berutek
          docker compose pull serv
          docker compose up -d --no-deps serv
